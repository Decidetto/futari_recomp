name: Guards

# Cheap static guards for a recomp game repo (no build needed):
#  - block accidental commits of copyrighted game data (it must stay gitignored)
#  - enforce springah/noreply commit identity (the repos were identity-scrubbed)
on: [pull_request, push]

permissions:
  contents: read

jobs:
  no-game-data:
    name: No copyrighted game data tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject tracked game assets / dumps
        run: |
          # Game data must live only in the gitignored assets/ + generated/ trees.
          bad="$(git ls-files | grep -iE '(^|/)(assets|dlc)/|\.(xex|xexp|iso|god|xwb|xsb|wmv|xma|mrg|mrgc|bik)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::game-data-like files are tracked (must stay gitignored):"
            echo "$bad"
            exit 1
          fi
          echo "clean: no game data tracked"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint tracked shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash' | grep -vE '^thirdparty/' || true)
          if [ "${#scripts[@]}" -eq 0 ]; then echo "no shell scripts"; exit 0; fi
          printf '  %s\n' "${scripts[@]}"
          # error-severity: catches real breakage (bad heredocs, CRLF, syntax)
          # without failing on pre-existing style nits.
          shellcheck --severity=error "${scripts[@]}"

  ini-merge-test:
    # The one unit the save path leans on that needs no SDK, no game data and
    # no codegen: the futari.ini merge (src/ini_merge.h). tests/ini_merge_test.cpp
    # names the rules; a failure here is a player's settings file being damaged.
    name: ini merge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests/ini_merge_test.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I src tests/ini_merge_test.cpp -o ini_merge_test
          ./ini_merge_test

  hidden-settings-test:
    # The resolution settings F4 hides (src/hidden_settings.h) and when a save
    # keeps one in the managed block: only where the file already had it. Pure std.
    name: hidden settings test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests/hidden_settings_test.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I src tests/hidden_settings_test.cpp -o hidden_settings_test
          ./hidden_settings_test

  screen-layout-test:
    # The size rules of the game's output-sized frame (src/screen_layout_math.h):
    # the clamp and the game's widescreen rule. Pure std, like the ini merge test.
    name: screen layout test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests/screen_layout_test.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I src tests/screen_layout_test.cpp -o screen_layout_test
          ./screen_layout_test

  ini-resolution-test:
    # The [Display] resolution a save writes (src/ini_resolution.h): the size as
    # typed when nothing changed it, a picked size as picked. Pure std.
    name: ini resolution test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests/ini_resolution_test.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I src tests/ini_resolution_test.cpp -o ini_resolution_test
          ./ini_resolution_test

  edram-tiles-test:
    # Renut's EDRAM tile count and the rule for surfaces larger than the
    # console's 2048 tiles (src/renut_engine/gpu/d3d/edram_tiles.h). Pure std.
    name: edram tiles test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests/edram_tiles_test.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I src tests/edram_tiles_test.cpp -o edram_tiles_test
          ./edram_tiles_test

  capture-series-test:
    # The names of the F9 frame captures (src/dev/capture_series.h): the
    # numbering that never overwrites a capture. Pure std.
    name: capture series test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests/capture_series_test.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I src tests/capture_series_test.cpp -o capture_series_test
          ./capture_series_test

  input-recording-test:
    # The text format of the dev input record/replay (src/dev/input_recording.h)
    # and the replay cursor. Pure std.
    name: input recording test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests/input_recording_test.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I src tests/input_recording_test.cpp -o input_recording_test
          ./input_recording_test

  presented-frame-test:
    # When Renut's present copies the game's frame pixel for pixel instead of
    # scaling it (src/renut_engine/gpu/backend/presented_frame.h). Pure std.
    name: presented frame test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests/presented_frame_test.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I src tests/presented_frame_test.cpp -o presented_frame_test
          ./presented_frame_test

  front-buffer-block-test:
    # Whether a resized automatic front buffer reuses its data block or needs a
    # larger one (src/renut_engine/gpu/d3d/front_buffer_block.h). Pure std.
    name: front buffer block test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and run tests/front_buffer_block_test.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I src tests/front_buffer_block_test.cpp -o front_buffer_block_test
          ./front_buffer_block_test

  identity:
    name: Commit identity (springah/noreply)
    # Maintainer pushes only. Outside contributors have their own identities and
    # must not be failed for it -- this guard exists to catch a local git config
    # slip leaking a real address into a public repo, not to gate contributions.
    if: github.event_name == 'push' && github.repository_owner == 'springah'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject non-springah author/committer on pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          ok="321120+springah@users.noreply.github.com"
          # New-branch pushes report an all-zero "before"; fall back to HEAD only.
          if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="-1 $AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          fail=0
          while read -r sha ae ce; do
            [ -n "$sha" ] || continue
            if [ "$ae" != "$ok" ]; then echo "::error::$sha author '$ae' != $ok"; fail=1; fi
            if [ "$ce" != "$ok" ]; then echo "::error::$sha committer '$ce' != $ok"; fail=1; fi
          done <<< "$(git log --format='%H %ae %ce' $range)"
          [ "$fail" -eq 0 ] && echo "identity OK"
          exit $fail
